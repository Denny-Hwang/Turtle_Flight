<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Turbo - flying with rocket shell (front-facing, vehicle integrated) -->
  <!-- Cloud wisps -->
  <ellipse cx="55" cy="80" rx="22" ry="9" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="345" cy="100" rx="20" ry="8" fill="#FFFFFF" opacity="0.5"/>
  <!-- Speed lines on left -->
  <path d="M25 200 Q60 202 90 200" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M30 245 Q65 247 95 245" stroke="#85B7EB" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- Center main flame trail -->
  <path d="M180 350 Q200 395 220 350 Z" fill="#EF9F27" opacity="0.7"/>
  <path d="M188 350 Q200 380 212 350 Z" fill="#E8593C" opacity="0.7"/>
  <path d="M193 350 Q200 370 207 350 Z" fill="#FAC775" opacity="0.6"/>
  <!-- Side booster flames -->
  <path d="M115 340 Q125 365 135 340 Z" fill="#EF9F27" opacity="0.65"/>
  <path d="M120 340 Q125 358 130 340 Z" fill="#E8593C" opacity="0.6"/>
  <path d="M265 340 Q275 365 285 340 Z" fill="#EF9F27" opacity="0.65"/>
  <path d="M270 340 Q275 358 280 340 Z" fill="#E8593C" opacity="0.6"/>
  <!-- Side rocket boosters -->
  <rect x="100" y="280" width="40" height="65" rx="13" fill="#888780" stroke="#5F5E5A" stroke-width="2.5"/>
  <rect x="260" y="280" width="40" height="65" rx="13" fill="#888780" stroke="#5F5E5A" stroke-width="2.5"/>
  <ellipse cx="120" cy="345" rx="20" ry="6" fill="#3C3F42" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="280" cy="345" rx="20" ry="6" fill="#3C3F42" stroke="#000" stroke-width="1.5"/>
  <line x1="108" y1="290" x2="108" y2="335" stroke="#B4B2A9" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
  <line x1="268" y1="290" x2="268" y2="335" stroke="#B4B2A9" stroke-width="2" opacity="0.7" stroke-linecap="round"/>
  <!-- Center thruster -->
  <path d="M183 320 L177 350 L223 350 L217 320 Z" fill="#888780" stroke="#5F5E5A" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="350" rx="23" ry="5" fill="#3C3F42" stroke="#000" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="305" rx="80" ry="55" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="200" cy="313" rx="50" ry="38" fill="#FAEEDA" stroke="#085041" stroke-width="2"/>
  <!-- Arms stretched out -->
  <ellipse cx="115" cy="295" rx="22" ry="13" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" transform="rotate(-12 115 295)"/>
  <ellipse cx="285" cy="295" rx="22" ry="13" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" transform="rotate(12 285 295)"/>
  <!-- Shell hint behind body -->
  <path d="M150 270 Q200 258 250 270" stroke="#1D9E75" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Scarf -->
  <path d="M160 260 Q200 270 240 260 Q243 270 235 275 Q200 280 165 275 Q157 270 160 260 Z" fill="#E24B4A" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Scarf flowing left -->
  <path d="M160 265 Q90 263 35 290 Q55 305 110 298 Q145 292 160 282 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  <line x1="140" y1="278" x2="55" y2="298" stroke="#A32D2D" stroke-width="1" opacity="0.6"/>
  <!-- Head -->
  <circle cx="200" cy="170" r="115" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Cheek blush -->
  <circle cx="120" cy="200" r="13" fill="#F0997B" opacity="0.5"/>
  <circle cx="280" cy="200" r="13" fill="#F0997B" opacity="0.5"/>
  <!-- Eyes (slight squint for speed) -->
  <ellipse cx="165" cy="170" rx="20" ry="22" fill="#FFFFFF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="235" cy="170" rx="20" ry="22" fill="#FFFFFF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="167" cy="170" rx="13" ry="14" fill="#085041"/>
  <ellipse cx="237" cy="170" rx="13" ry="14" fill="#085041"/>
  <circle cx="161" cy="164" r="5" fill="#FFFFFF"/>
  <circle cx="231" cy="164" r="5" fill="#FFFFFF"/>
  <circle cx="172" cy="176" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="242" cy="176" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Glasses on face -->
  <circle cx="165" cy="170" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <circle cx="235" cy="170" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <line x1="195" y1="170" x2="205" y2="170" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="170" x2="125" y2="168" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="265" y1="170" x2="275" y2="168" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M188 222 Q200 230 212 222" stroke="#085041" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
