<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Turbo - default (front-facing, big head, glasses on face) -->
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="320" rx="80" ry="55" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Cream belly -->
  <ellipse cx="200" cy="328" rx="50" ry="38" fill="#FAEEDA" stroke="#085041" stroke-width="2"/>
  <!-- Stub arms -->
  <ellipse cx="125" cy="315" rx="20" ry="14" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="275" cy="315" rx="20" ry="14" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Shell back hint (visible behind body silhouette) -->
  <path d="M150 280 Q200 268 250 280" stroke="#1D9E75" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Red scarf around neck -->
  <path d="M160 270 Q200 280 240 270 Q243 280 235 285 Q200 290 165 285 Q157 280 160 270 Z" fill="#E24B4A" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M240 275 Q260 278 270 290 Q260 295 245 290 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  <!-- Head (BIG round) -->
  <circle cx="200" cy="180" r="115" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Cheek blush -->
  <circle cx="120" cy="210" r="13" fill="#F0997B" opacity="0.45"/>
  <circle cx="280" cy="210" r="13" fill="#F0997B" opacity="0.45"/>
  <!-- Eyes (big oval) -->
  <ellipse cx="165" cy="180" rx="20" ry="24" fill="#FFFFFF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="235" cy="180" rx="20" ry="24" fill="#FFFFFF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="167" cy="178" rx="13" ry="16" fill="#085041"/>
  <ellipse cx="237" cy="178" rx="13" ry="16" fill="#085041"/>
  <!-- Sparkles -->
  <circle cx="161" cy="172" r="5" fill="#FFFFFF"/>
  <circle cx="231" cy="172" r="5" fill="#FFFFFF"/>
  <circle cx="172" cy="186" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="242" cy="186" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Round brass glasses ON FACE (over eyes) -->
  <circle cx="165" cy="180" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <circle cx="235" cy="180" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <line x1="195" y1="180" x2="205" y2="180" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  <!-- Tiny brass earpiece arms -->
  <line x1="135" y1="180" x2="125" y2="178" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="265" y1="180" x2="275" y2="178" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M188 235 Q200 244 212 235" stroke="#085041" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
