<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Turbo icon -->
  <circle cx="100" cy="100" r="92" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="5"/>
  <defs>
    <clipPath id="turboCircle">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#turboCircle)">
    <!-- Head -->
    <circle cx="100" cy="100" r="78" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
    <!-- Blush -->
    <circle cx="42" cy="115" r="9" fill="#F0997B" opacity="0.5"/>
    <circle cx="158" cy="115" r="9" fill="#F0997B" opacity="0.5"/>
    <!-- Eyes -->
    <ellipse cx="78" cy="100" rx="14" ry="17" fill="#FFFFFF" stroke="#085041" stroke-width="2"/>
    <ellipse cx="122" cy="100" rx="14" ry="17" fill="#FFFFFF" stroke="#085041" stroke-width="2"/>
    <ellipse cx="80" cy="98" rx="9" ry="11" fill="#085041"/>
    <ellipse cx="124" cy="98" rx="9" ry="11" fill="#085041"/>
    <circle cx="76" cy="94" r="3.5" fill="#FFFFFF"/>
    <circle cx="120" cy="94" r="3.5" fill="#FFFFFF"/>
    <circle cx="83" cy="103" r="1.8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="127" cy="103" r="1.8" fill="#FFFFFF" opacity="0.5"/>
    <!-- Glasses on face -->
    <circle cx="78" cy="100" r="22" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="2.5"/>
    <circle cx="122" cy="100" r="22" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="2.5"/>
    <line x1="100" y1="100" x2="100" y2="100" stroke="#BA7517" stroke-width="2.5"/>
    <line x1="92" y1="100" x2="108" y2="100" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="100" x2="50" y2="98" stroke="#BA7517" stroke-width="2" stroke-linecap="round"/>
    <line x1="144" y1="100" x2="150" y2="98" stroke="#BA7517" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M88 140 Q100 150 112 140" stroke="#085041" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Scarf hint -->
    <path d="M55 178 Q100 188 145 178 Q148 192 138 198 Q100 202 62 198 Q52 192 55 178 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
