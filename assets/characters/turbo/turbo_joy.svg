<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Turbo - joy -->
  <!-- Sparkles -->
  <path d="M70 110 L73 120 L83 123 L73 126 L70 136 L67 126 L57 123 L67 120 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <path d="M335 100 L337 108 L345 110 L337 112 L335 120 L333 112 L325 110 L333 108 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <path d="M345 220 L347 227 L354 229 L347 231 L345 238 L343 231 L336 229 L343 227 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="320" rx="80" ry="55" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="200" cy="328" rx="50" ry="38" fill="#FAEEDA" stroke="#085041" stroke-width="2"/>
  <!-- Arms raised in joy -->
  <ellipse cx="115" cy="295" rx="18" ry="14" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" transform="rotate(-25 115 295)"/>
  <ellipse cx="285" cy="295" rx="18" ry="14" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" transform="rotate(25 285 295)"/>
  <!-- Scarf flutter up -->
  <path d="M160 270 Q200 280 240 270 Q243 280 235 285 Q200 290 165 285 Q157 280 160 270 Z" fill="#E24B4A" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M240 270 Q260 250 280 245 Q278 260 265 270 Q255 275 245 275 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="115" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Warm blush -->
  <circle cx="120" cy="210" r="15" fill="#F0997B" opacity="0.6"/>
  <circle cx="280" cy="210" r="15" fill="#F0997B" opacity="0.6"/>
  <!-- Crescent eyes (joy) -->
  <path d="M148 178 Q165 162 182 178" stroke="#085041" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M218 178 Q235 162 252 178" stroke="#085041" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Glasses still visible -->
  <circle cx="165" cy="180" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <circle cx="235" cy="180" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <line x1="195" y1="180" x2="205" y2="180" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="180" x2="125" y2="178" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="265" y1="180" x2="275" y2="178" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big open smile -->
  <path d="M178 232 Q200 258 222 232" stroke="#085041" stroke-width="2.5" fill="#FAEEDA" stroke-linejoin="round"/>
  <path d="M178 232 Q200 258 222 232" stroke="#085041" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
