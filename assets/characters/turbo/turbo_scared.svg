<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Turbo - scared -->
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="320" rx="80" ry="55" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="200" cy="328" rx="50" ry="38" fill="#FAEEDA" stroke="#085041" stroke-width="2"/>
  <!-- Arms pulled in -->
  <ellipse cx="135" cy="318" rx="18" ry="13" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="265" cy="318" rx="18" ry="13" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Scarf hanging limp -->
  <path d="M160 270 Q200 280 240 270 Q243 280 235 285 Q200 290 165 285 Q157 280 160 270 Z" fill="#E24B4A" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M240 280 Q255 295 252 308 Q242 305 240 290 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  <!-- Shell peeks UP behind head (rises to partially cover) -->
  <path d="M125 130 Q200 65 275 130 L275 100 Q200 40 125 100 Z" fill="#1D9E75" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M180 80 L210 95 L220 80" fill="none" stroke="#085041" stroke-width="1.5" opacity="0.6"/>
  <!-- Head -->
  <circle cx="200" cy="190" r="115" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- HUGE eyes (1.5x), tiny pupils -->
  <ellipse cx="165" cy="190" rx="28" ry="34" fill="#FFFFFF" stroke="#085041" stroke-width="3"/>
  <ellipse cx="235" cy="190" rx="28" ry="34" fill="#FFFFFF" stroke="#085041" stroke-width="3"/>
  <ellipse cx="167" cy="188" rx="4" ry="6" fill="#085041"/>
  <ellipse cx="237" cy="188" rx="4" ry="6" fill="#085041"/>
  <circle cx="165" cy="186" r="1.5" fill="#FFFFFF"/>
  <circle cx="235" cy="186" r="1.5" fill="#FFFFFF"/>
  <!-- Glasses askew -->
  <g transform="rotate(-8 200 188)">
    <circle cx="165" cy="188" r="32" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
    <circle cx="235" cy="188" r="32" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
    <line x1="195" y1="188" x2="205" y2="188" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Worried wavy mouth -->
  <path d="M183 248 Q190 242 197 248 Q204 254 211 248 Q218 242 222 248" stroke="#085041" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sweat drop -->
  <path d="M295 145 Q292 158 295 168 Q303 163 303 154 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="298" cy="153" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
