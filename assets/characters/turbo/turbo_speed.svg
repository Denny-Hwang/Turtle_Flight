<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Turbo - speed -->
  <!-- Wind lines on left -->
  <path d="M30 130 Q60 132 90 130" stroke="#85B7EB" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 175 Q60 177 95 175" stroke="#85B7EB" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 220 Q70 222 100 220" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 270 Q75 272 105 270" stroke="#85B7EB" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="320" rx="80" ry="55" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="200" cy="328" rx="50" ry="38" fill="#FAEEDA" stroke="#085041" stroke-width="2"/>
  <!-- Arms back -->
  <ellipse cx="125" cy="325" rx="20" ry="13" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" transform="rotate(-15 125 325)"/>
  <ellipse cx="275" cy="325" rx="20" ry="13" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" transform="rotate(15 275 325)"/>
  <!-- Scarf streaming back/left dramatically -->
  <path d="M160 270 Q200 280 240 270 Q243 280 235 285 Q200 290 165 285 Q157 280 160 270 Z" fill="#E24B4A" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M160 275 Q90 270 30 295 Q55 310 110 305 Q145 300 160 290 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  <line x1="140" y1="285" x2="50" y2="302" stroke="#A32D2D" stroke-width="1" opacity="0.6"/>
  <line x1="125" y1="295" x2="60" y2="307" stroke="#A32D2D" stroke-width="1" opacity="0.5"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="115" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <!-- Squinted eyes with upper lid -->
  <ellipse cx="165" cy="180" rx="20" ry="18" fill="#FFFFFF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="235" cy="180" rx="20" ry="18" fill="#FFFFFF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="167" cy="183" rx="13" ry="11" fill="#085041"/>
  <ellipse cx="237" cy="183" rx="13" ry="11" fill="#085041"/>
  <!-- Upper lid overlay -->
  <path d="M145 168 Q165 178 185 168 L185 174 Q165 184 145 174 Z" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <path d="M215 168 Q235 178 255 168 L255 174 Q235 184 215 174 Z" fill="#5DCAA5" stroke="#085041" stroke-width="2.5"/>
  <circle cx="163" cy="183" r="1.8" fill="#FFFFFF"/>
  <circle cx="233" cy="183" r="1.8" fill="#FFFFFF"/>
  <!-- Glasses -->
  <circle cx="165" cy="180" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <circle cx="235" cy="180" r="30" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="3"/>
  <line x1="195" y1="180" x2="205" y2="180" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  <!-- Tight grin -->
  <path d="M180 235 Q200 247 220 235" stroke="#085041" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Wind streaks across cheeks -->
  <line x1="100" y1="200" x2="125" y2="200" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="105" y1="225" x2="125" y2="225" stroke="#FFFFFF" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>
