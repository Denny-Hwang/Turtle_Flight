<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Turbo - speed expression -->
  <!-- Wind lines on left -->
  <path d="M40 130 Q70 132 95 130" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 170 Q70 172 100 170" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M40 210 Q75 212 100 210" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M50 250 Q80 252 110 250" stroke="#85B7EB" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Tail -->
  <path d="M310 240 Q330 235 332 250 Q330 260 310 255 Z" fill="#A8E6CF" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Back legs trailing -->
  <ellipse cx="245" cy="295" rx="22" ry="18" fill="#A8E6CF" stroke="#085041" stroke-width="2.5"/>
  <ellipse cx="135" cy="295" rx="22" ry="18" fill="#A8E6CF" stroke="#085041" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="260" rx="95" ry="55" fill="#FAEEDA" stroke="#085041" stroke-width="2.5"/>
  <!-- Front legs back -->
  <ellipse cx="115" cy="245" rx="20" ry="18" fill="#A8E6CF" stroke="#085041" stroke-width="2.5" transform="rotate(-25 115 245)"/>
  <ellipse cx="285" cy="245" rx="20" ry="18" fill="#A8E6CF" stroke="#085041" stroke-width="2.5" transform="rotate(25 285 245)"/>
  <!-- Shell -->
  <path d="M110 240 Q110 150 200 145 Q290 150 290 240 Z" fill="#5DCAA5" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M200 165 L225 178 L225 205 L200 218 L175 205 L175 178 Z" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>
  <path d="M150 195 Q160 185 175 195" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M225 195 Q240 185 250 195" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M150 220 Q165 215 175 220" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M225 220 Q240 215 250 220" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="200" cy="155" rx="78" ry="72" fill="#A8E6CF" stroke="#085041" stroke-width="2.5"/>
  <!-- Cheek shading -->
  <ellipse cx="148" cy="175" rx="14" ry="9" fill="#5DCAA5" opacity="0.35"/>
  <ellipse cx="252" cy="175" rx="14" ry="9" fill="#5DCAA5" opacity="0.35"/>
  <!-- Goggles -->
  <path d="M125 110 Q200 95 275 110" stroke="#5F5E5A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="170" cy="115" rx="22" ry="17" fill="#E6F1FB" fill-opacity="0.7" stroke="#BA7517" stroke-width="2.5"/>
  <ellipse cx="230" cy="115" rx="22" ry="17" fill="#E6F1FB" fill-opacity="0.7" stroke="#BA7517" stroke-width="2.5"/>
  <line x1="192" y1="115" x2="208" y2="115" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="163" cy="110" rx="6" ry="3" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="223" cy="110" rx="6" ry="3" fill="#FFFFFF" opacity="0.7"/>
  <!-- Squinted eyes with upper lid overlay -->
  <ellipse cx="170" cy="160" rx="11" ry="15" fill="#FFFFFF" stroke="#085041" stroke-width="2"/>
  <ellipse cx="230" cy="160" rx="11" ry="15" fill="#FFFFFF" stroke="#085041" stroke-width="2"/>
  <ellipse cx="171" cy="160" rx="6" ry="9" fill="#085041"/>
  <ellipse cx="231" cy="160" rx="6" ry="9" fill="#085041"/>
  <!-- Upper eyelid overlay -->
  <path d="M159 152 Q170 158 181 152 L181 156 Q170 162 159 156 Z" fill="#A8E6CF" stroke="#085041" stroke-width="2"/>
  <path d="M219 152 Q230 158 241 152 L241 156 Q230 162 219 156 Z" fill="#A8E6CF" stroke="#085041" stroke-width="2"/>
  <circle cx="168" cy="160" r="1.8" fill="#FFFFFF"/>
  <circle cx="228" cy="160" r="1.8" fill="#FFFFFF"/>
  <!-- Tight grin -->
  <path d="M183 195 Q200 205 217 195" stroke="#085041" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Wind streaks across face -->
  <line x1="105" y1="155" x2="135" y2="155" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="105" y1="180" x2="130" y2="180" stroke="#FFFFFF" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- Scarf streaming behind -->
  <path d="M150 215 Q200 228 250 215 Q255 235 245 245 Q200 252 155 245 Q145 235 150 215 Z" fill="#E24B4A" stroke="#085041" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M250 220 Q310 215 360 245 Q340 260 290 255 Q260 250 250 240 Z" fill="#E24B4A" stroke="#085041" stroke-width="2" stroke-linejoin="round"/>
  <line x1="265" y1="232" x2="345" y2="248" stroke="#A32D2D" stroke-width="1" opacity="0.6"/>
</svg>
