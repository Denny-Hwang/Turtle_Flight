  <ellipse cx="217" cy="288" rx="2" ry="6" fill="#26215C"/>
  <circle cx="180" cy="285" r="2.5" fill="#FFFFFF"/>
  <circle cx="214" cy="285" r="2.5" fill="#FFFFFF"/>
