  <circle cx="135" cy="328" r="2.5" fill="#ED93B1"/>
  <circle cx="262" cy="322" r="2" fill="#ED93B1"/>
  <circle cx="270" cy="322" r="2" fill="#ED93B1"/>
  <circle cx="265" cy="328" r="2.5" fill="#ED93B1"/>
  <!-- Tail curls out right -->
  <path d="M275 335 Q310 345 325 330 Q330 318 315 318" stroke="#3C3489" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M275 335 Q310 345 325 330 Q330 318 315 318" stroke="#CECBF6" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="315" cy="318" rx="8" ry="6" fill="#534AB7"/>
