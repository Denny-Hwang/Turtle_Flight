  <ellipse cx="135" cy="320" rx="14" ry="10" fill="#CECBF6" stroke="#3C3489" stroke-width="2"/>
  <ellipse cx="265" cy="320" rx="14" ry="10" fill="#CECBF6" stroke="#3C3489" stroke-width="2"/>
