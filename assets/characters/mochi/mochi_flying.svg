  <ellipse cx="217" cy="285" rx="11" ry="13" fill="#FFFFFF" stroke="#3C3489" stroke-width="2"/>
  <path d="M173 280 Q183 285 193 280 Q193 274 183 274 Q173 274 173 280 Z" fill="#CECBF6" stroke="#3C3489" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M207 280 Q217 285 227 280 Q227 274 217 274 Q207 274 207 280 Z" fill="#CECBF6" stroke="#3C3489" stroke-width="1.8" stroke-linejoin="round"/>
