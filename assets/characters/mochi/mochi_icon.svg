    <ellipse cx="120" cy="110" rx="5" ry="7" fill="#3C3489"/>
    <ellipse cx="80" cy="110" rx="1.5" ry="5" fill="#26215C"/>
    <ellipse cx="120" cy="110" rx="1.5" ry="5" fill="#26215C"/>
