<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Nutty - joy -->
  <path d="M70 110 L72 118 L80 120 L72 122 L70 130 L68 122 L60 120 L68 118 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <path d="M340 110 L342 118 L350 120 L342 122 L340 130 L338 122 L330 120 L338 118 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <!-- Tail -->
  <circle cx="310" cy="290" r="14" fill="#FAEEDA" stroke="#633806" stroke-width="2.5"/>
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="305" rx="90" ry="70" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="200" cy="320" rx="55" ry="50" fill="#FAC775" stroke="#BA7517" stroke-width="1.5" opacity="0.95"/>
  <!-- Arms raised -->
  <ellipse cx="105" cy="280" rx="18" ry="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5" transform="rotate(-30 105 280)"/>
  <ellipse cx="295" cy="280" rx="18" ry="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5" transform="rotate(30 295 280)"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="115" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <!-- Ears -->
  <circle cx="135" cy="100" r="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="265" cy="100" r="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="135" cy="103" r="11" fill="#F5C4B3"/>
  <circle cx="265" cy="103" r="11" fill="#F5C4B3"/>
  <!-- Cheeks MAXIMUM - asymmetric still -->
  <ellipse cx="125" cy="220" rx="32" ry="38" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="275" cy="220" rx="42" ry="46" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="128" cy="225" rx="11" ry="8" fill="#F0997B" opacity="0.55"/>
  <ellipse cx="280" cy="225" rx="15" ry="11" fill="#F0997B" opacity="0.55"/>
  <!-- Both crescent eyes (mismatch gone) -->
  <path d="M155 180 Q172 162 189 180" stroke="#633806" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M211 180 Q232 162 253 180" stroke="#633806" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="200" cy="225" rx="6" ry="5" fill="#D85A30" stroke="#633806" stroke-width="1.5"/>
  <!-- Huge grin -->
  <path d="M170 245 Q200 268 230 245" stroke="#633806" stroke-width="2.5" fill="#FAEEDA" stroke-linecap="round"/>
  <path d="M170 245 Q200 268 230 245" stroke="#633806" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="90" y1="220" x2="125" y2="225" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="85" y1="232" x2="125" y2="232" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="90" y1="244" x2="125" y2="240" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="275" y1="225" x2="310" y2="220" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="275" y1="232" x2="315" y2="232" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="275" y1="240" x2="310" y2="244" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
</svg>
