  <line x1="90" y1="208" x2="125" y2="208" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="95" y1="220" x2="125" y2="215" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="275" y1="200" x2="305" y2="195" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="275" y1="208" x2="310" y2="208" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="275" y1="215" x2="305" y2="220" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
