  <ellipse cx="125" cy="195" rx="34" ry="38" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="275" cy="195" rx="44" ry="48" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
