<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Nutty - speed (cheeks flatten, seeds fly behind) -->
  <!-- Wind lines on left -->
  <path d="M30 130 Q60 132 90 130" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 175 Q60 177 95 175" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 220 Q70 222 100 220" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Seeds flying behind right -->
  <path d="M325 145 Q323 153 326 159 Q330 156 328 149 Z" fill="#97C459" stroke="#3B6D11" stroke-width="1" stroke-linejoin="round"/>
  <path d="M345 200 Q343 208 346 214 Q350 211 348 204 Z" fill="#97C459" stroke="#3B6D11" stroke-width="1" stroke-linejoin="round"/>
  <path d="M355 285 Q353 293 356 299 Q360 296 358 289 Z" fill="#97C459" stroke="#3B6D11" stroke-width="1" stroke-linejoin="round"/>
  <!-- Tail -->
  <circle cx="310" cy="290" r="14" fill="#FAEEDA" stroke="#633806" stroke-width="2.5"/>
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="305" rx="90" ry="70" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="200" cy="320" rx="55" ry="50" fill="#FAC775" stroke="#BA7517" stroke-width="1.5" opacity="0.95"/>
  <!-- Arms back -->
  <ellipse cx="110" cy="310" rx="18" ry="14" fill="#EF9F27" stroke="#633806" stroke-width="2.5" transform="rotate(-25 110 310)"/>
  <ellipse cx="290" cy="310" rx="18" ry="14" fill="#EF9F27" stroke="#633806" stroke-width="2.5" transform="rotate(25 290 310)"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="115" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <!-- Ears -->
  <circle cx="135" cy="100" r="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="265" cy="100" r="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="135" cy="103" r="11" fill="#F5C4B3"/>
  <circle cx="265" cy="103" r="11" fill="#F5C4B3"/>
  <!-- Cheeks FLATTENED - asymmetric -->
  <ellipse cx="135" cy="220" rx="32" ry="22" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="265" cy="220" rx="42" ry="28" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <!-- Squinted asymmetric eyes -->
  <ellipse cx="170" cy="180" rx="18" ry="14" fill="#FFFFFF" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="232" cy="180" rx="22" ry="17" fill="#FFFFFF" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="172" cy="182" rx="11" ry="9" fill="#633806"/>
  <ellipse cx="234" cy="182" rx="14" ry="11" fill="#633806"/>
  <path d="M152 170 Q170 180 188 170 L188 175 Q170 185 152 175 Z" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <path d="M210 170 Q232 180 254 170 L254 175 Q232 185 210 175 Z" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="168" cy="180" r="1.5" fill="#FFFFFF"/>
  <circle cx="230" cy="180" r="1.7" fill="#FFFFFF"/>
  <!-- Nose -->
  <ellipse cx="200" cy="225" rx="6" ry="5" fill="#D85A30" stroke="#633806" stroke-width="1.5"/>
  <!-- Excited grin still -->
  <path d="M180 245 Q200 263 220 245" stroke="#633806" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers swept -->
  <line x1="100" y1="220" x2="135" y2="225" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="95" y1="232" x2="135" y2="232" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="100" y1="244" x2="135" y2="240" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="265" y1="225" x2="305" y2="220" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="265" y1="232" x2="310" y2="232" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
  <line x1="265" y1="240" x2="305" y2="244" stroke="#633806" stroke-width="1" opacity="0.35" stroke-linecap="round"/>
</svg>
