<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Nutty - scared (cheeks deflate, spiral eyes, seeds fall) -->
  <!-- Falling seeds -->
  <path d="M75 270 Q73 278 76 284 Q80 281 78 274 Z" fill="#97C459" stroke="#3B6D11" stroke-width="1" stroke-linejoin="round"/>
  <path d="M85 310 Q83 318 86 324 Q90 321 88 314 Z" fill="#97C459" stroke="#3B6D11" stroke-width="1" stroke-linejoin="round"/>
  <path d="M325 280 Q323 288 326 294 Q330 291 328 284 Z" fill="#97C459" stroke="#3B6D11" stroke-width="1" stroke-linejoin="round"/>
  <!-- Tail -->
  <circle cx="310" cy="290" r="14" fill="#FAEEDA" stroke="#633806" stroke-width="2.5"/>
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="305" rx="90" ry="70" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="200" cy="320" rx="55" ry="50" fill="#FAC775" stroke="#BA7517" stroke-width="1.5" opacity="0.95"/>
  <!-- Arms raised in fear -->
  <ellipse cx="115" cy="290" rx="18" ry="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="285" cy="290" rx="18" ry="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="115" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <!-- Ears -->
  <circle cx="135" cy="100" r="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="265" cy="100" r="20" fill="#EF9F27" stroke="#633806" stroke-width="2.5"/>
  <circle cx="135" cy="103" r="11" fill="#F5C4B3"/>
  <circle cx="265" cy="103" r="11" fill="#F5C4B3"/>
  <!-- DEFLATED cheeks - half size, asymmetric -->
  <ellipse cx="145" cy="225" rx="14" ry="16" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <ellipse cx="255" cy="225" rx="19" ry="21" fill="#FAC775" stroke="#633806" stroke-width="2.5"/>
  <!-- Spiral eyes -->
  <path d="M170 180 Q160 168 172 162 Q186 162 188 175 Q186 188 172 188 Q158 187 160 173 Q162 160 178 160" stroke="#633806" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M232 180 Q222 168 234 162 Q248 162 250 175 Q248 188 234 188 Q220 187 222 173 Q224 160 240 160" stroke="#633806" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="200" cy="220" rx="6" ry="5" fill="#D85A30" stroke="#633806" stroke-width="1.5"/>
  <!-- Wobbly mouth -->
  <path d="M178 245 Q188 240 196 245 Q204 250 212 245 Q220 240 222 245" stroke="#633806" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sweat drop -->
  <path d="M120 145 Q117 158 120 168 Q127 163 127 154 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="123" cy="153" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
