<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Bounce - flying on lily pad glider -->
  <!-- Water droplet trail below -->
  <circle cx="55" cy="320" r="5" fill="#85B7EB" opacity="0.7" stroke="#185FA5" stroke-width="0.8"/>
  <circle cx="35" cy="345" r="4" fill="#85B7EB" opacity="0.6" stroke="#185FA5" stroke-width="0.8"/>
  <circle cx="80" cy="360" r="4" fill="#85B7EB" opacity="0.5" stroke="#185FA5" stroke-width="0.8"/>
  <circle cx="55" cy="385" r="3" fill="#85B7EB" opacity="0.4"/>
  <circle cx="320" cy="335" r="4" fill="#85B7EB" opacity="0.55" stroke="#185FA5" stroke-width="0.8"/>
  <circle cx="345" cy="365" r="3" fill="#85B7EB" opacity="0.4"/>
  <!-- Lily pad (oversized, curled wing-shape edges) -->
  <path d="M50 270 Q40 240 70 215 Q120 195 200 200 L200 215 Q280 195 330 215 Q360 240 350 270 Q300 295 250 290 L210 280 Q260 290 320 285 Q280 320 200 325 Q120 320 80 285 Q140 290 190 280 L150 290 Q100 295 50 270 Z" fill="#97C459" stroke="#27500A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- V-notch -->
  <path d="M180 280 L200 215 L220 280 Z" fill="#639922" stroke="#27500A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Vein lines -->
  <path d="M200 215 Q150 240 80 250" stroke="#C0DD97" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M200 215 Q250 240 320 250" stroke="#C0DD97" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M200 215 Q170 250 130 280" stroke="#C0DD97" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M200 215 Q230 250 270 280" stroke="#C0DD97" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <!-- Lotus flower at front -->
  <ellipse cx="195" cy="135" rx="32" ry="14" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="200" cy="125" rx="28" ry="14" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="205" cy="135" rx="32" ry="14" fill="#ED93B1" stroke="#A32D2D" stroke-width="1.8" stroke-linejoin="round" opacity="0.85"/>
  <ellipse cx="200" cy="145" rx="22" ry="11" fill="#F0997B" stroke="#A32D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="200" cy="135" r="9" fill="#EF9F27" stroke="#BA7517" stroke-width="1.5"/>
  <circle cx="200" cy="135" r="4" fill="#FAC775"/>
  <circle cx="200" cy="135" r="40" fill="#FAC775" opacity="0.15"/>
  <!-- Bounce sitting on top -->
  <ellipse cx="200" cy="265" rx="80" ry="55" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="200" cy="280" rx="55" ry="35" fill="#C0DD97" stroke="#639922" stroke-width="1.2" opacity="0.95"/>
  <!-- Spots -->
  <circle cx="160" cy="240" r="6" fill="#639922" opacity="0.4"/>
  <circle cx="240" cy="240" r="6" fill="#639922" opacity="0.4"/>
  <!-- Arms up in excitement -->
  <ellipse cx="125" cy="220" rx="16" ry="22" fill="#639922" stroke="#27500A" stroke-width="2" transform="rotate(-25 125 220)"/>
  <ellipse cx="275" cy="220" rx="16" ry="22" fill="#639922" stroke="#27500A" stroke-width="2" transform="rotate(25 275 220)"/>
  <!-- Back webbed feet peek -->
  <ellipse cx="155" cy="295" rx="22" ry="11" fill="#639922" stroke="#27500A" stroke-width="2"/>
  <ellipse cx="245" cy="295" rx="22" ry="11" fill="#639922" stroke="#27500A" stroke-width="2"/>
  <!-- Eye bumps -->
  <ellipse cx="170" cy="195" rx="28" ry="32" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="230" cy="195" rx="28" ry="32" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Excited eyes -->
  <ellipse cx="170" cy="195" rx="18" ry="22" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="230" cy="195" rx="18" ry="22" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="170" cy="195" rx="11" ry="14" fill="#27500A"/>
  <ellipse cx="230" cy="195" rx="11" ry="14" fill="#27500A"/>
  <circle cx="167" cy="190" r="3.5" fill="#FFFFFF"/>
  <circle cx="227" cy="190" r="3.5" fill="#FFFFFF"/>
  <circle cx="172" cy="200" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="232" cy="200" r="2" fill="#FFFFFF" opacity="0.5"/>
  <!-- Blush -->
  <ellipse cx="135" cy="240" rx="13" ry="9" fill="#F0997B" opacity="0.55"/>
  <ellipse cx="265" cy="240" rx="13" ry="9" fill="#F0997B" opacity="0.55"/>
  <!-- HUGE GRIN -->
  <path d="M120 240 Q200 305 280 240" stroke="#27500A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M120 240 Q200 295 280 240" fill="#27500A" opacity="0.15"/>
  <!-- Tongue peek -->
  <path d="M245 270 Q260 278 263 290 Q252 290 243 280 Z" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Nostrils -->
  <ellipse cx="195" cy="225" rx="2.5" ry="3" fill="#27500A"/>
  <ellipse cx="205" cy="225" rx="2.5" ry="3" fill="#27500A"/>
</svg>
