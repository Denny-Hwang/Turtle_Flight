<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Bounce - scared (eyes 2x size, "O" mouth) -->
  <ellipse cx="115" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="285" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="280" rx="100" ry="80" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="200" cy="290" rx="65" ry="55" fill="#C0DD97" stroke="#639922" stroke-width="1.5" opacity="0.95"/>
  <!-- Arms trembling -->
  <ellipse cx="125" cy="295" rx="18" ry="14" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="275" cy="295" rx="18" ry="14" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Head -->
  <ellipse cx="200" cy="180" rx="115" ry="105" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Eye bumps - bigger -->
  <ellipse cx="135" cy="95" rx="50" ry="55" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="265" cy="95" rx="50" ry="55" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- 2x size eyes -->
  <ellipse cx="135" cy="95" rx="38" ry="46" fill="#FFFFFF" stroke="#27500A" stroke-width="3"/>
  <ellipse cx="265" cy="95" rx="38" ry="46" fill="#FFFFFF" stroke="#27500A" stroke-width="3"/>
  <!-- Tiny dot pupils -->
  <ellipse cx="135" cy="93" rx="5" ry="6" fill="#27500A"/>
  <ellipse cx="265" cy="93" rx="5" ry="6" fill="#27500A"/>
  <circle cx="133" cy="91" r="1.4" fill="#FFFFFF"/>
  <circle cx="263" cy="91" r="1.4" fill="#FFFFFF"/>
  <!-- "O" mouth -->
  <ellipse cx="200" cy="215" rx="22" ry="28" fill="#27500A" stroke="#185FA5" stroke-width="2"/>
  <ellipse cx="200" cy="217" rx="14" ry="18" fill="#A32D2D"/>
  <!-- Sweat drop -->
  <path d="M315 105 Q312 118 315 128 Q323 123 323 114 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="318" cy="113" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Nostrils -->
  <ellipse cx="190" cy="180" rx="2.5" ry="3" fill="#27500A"/>
  <ellipse cx="210" cy="180" rx="2.5" ry="3" fill="#27500A"/>
</svg>
