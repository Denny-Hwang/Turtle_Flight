<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Bounce - joy (crescent eyes, mouth wider, tongue out) -->
  <path d="M70 105 L72 113 L80 115 L72 117 L70 125 L68 117 L60 115 L68 113 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <path d="M335 100 L337 108 L345 110 L337 112 L335 120 L333 112 L325 110 L333 108 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <!-- Back legs/feet -->
  <ellipse cx="115" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="285" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="280" rx="100" ry="80" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="200" cy="290" rx="65" ry="55" fill="#C0DD97" stroke="#639922" stroke-width="1.5" opacity="0.95"/>
  <!-- Arms raised -->
  <ellipse cx="105" cy="255" rx="18" ry="20" fill="#97C459" stroke="#27500A" stroke-width="2.5" transform="rotate(-30 105 255)"/>
  <ellipse cx="295" cy="255" rx="18" ry="20" fill="#97C459" stroke="#27500A" stroke-width="2.5" transform="rotate(30 295 255)"/>
  <!-- Head -->
  <ellipse cx="200" cy="180" rx="115" ry="105" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Eye bumps -->
  <ellipse cx="155" cy="105" rx="38" ry="42" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="245" cy="105" rx="38" ry="42" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- PURE crescent eyes -->
  <path d="M135 105 Q155 88 175 105" stroke="#27500A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M225 105 Q245 88 265 105" stroke="#27500A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="110" cy="200" rx="15" ry="11" fill="#F0997B" opacity="0.6"/>
  <ellipse cx="290" cy="200" rx="15" ry="11" fill="#F0997B" opacity="0.6"/>
  <!-- Mouth wider -->
  <path d="M85 195 Q200 305 315 195" stroke="#27500A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M85 195 Q200 295 315 195" fill="#27500A" opacity="0.2"/>
  <!-- Tongue fully out -->
  <path d="M180 260 Q200 305 220 260 Q220 305 200 318 Q180 305 180 260 Z" fill="#E24B4A" stroke="#A32D2D" stroke-width="2" stroke-linejoin="round"/>
  <line x1="200" y1="270" x2="200" y2="305" stroke="#A32D2D" stroke-width="1.5"/>
  <!-- Nostrils -->
  <ellipse cx="190" cy="170" rx="2.5" ry="3" fill="#27500A"/>
  <ellipse cx="210" cy="170" rx="2.5" ry="3" fill="#27500A"/>
</svg>
