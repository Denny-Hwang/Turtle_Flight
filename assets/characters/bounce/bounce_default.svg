<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Bounce default (front facing, eye bumps on top, enormous grin) -->
  <!-- Back legs / feet at sides -->
  <ellipse cx="115" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="285" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <!-- Webbed toe lines -->
  <path d="M85 350 Q90 360 95 350" stroke="#27500A" stroke-width="1.5" fill="none"/>
  <path d="M105 350 Q110 362 115 350" stroke="#27500A" stroke-width="1.5" fill="none"/>
  <path d="M125 350 Q130 362 135 350" stroke="#27500A" stroke-width="1.5" fill="none"/>
  <path d="M265 350 Q270 362 275 350" stroke="#27500A" stroke-width="1.5" fill="none"/>
  <path d="M285 350 Q290 362 295 350" stroke="#27500A" stroke-width="1.5" fill="none"/>
  <path d="M305 350 Q310 360 315 350" stroke="#27500A" stroke-width="1.5" fill="none"/>
  <!-- Body -->
  <ellipse cx="200" cy="280" rx="100" ry="80" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Belly -->
  <ellipse cx="200" cy="290" rx="65" ry="55" fill="#C0DD97" stroke="#639922" stroke-width="1.5" opacity="0.95"/>
  <!-- Front arms -->
  <ellipse cx="125" cy="285" rx="20" ry="14" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="275" cy="285" rx="20" ry="14" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Spots on back (above belly) -->
  <circle cx="155" cy="240" r="7" fill="#639922" opacity="0.4"/>
  <circle cx="245" cy="240" r="7" fill="#639922" opacity="0.4"/>
  <!-- Head (wide, merges with body) -->
  <ellipse cx="200" cy="180" rx="115" ry="105" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Eye bumps on TOP of head -->
  <ellipse cx="155" cy="105" rx="38" ry="42" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="245" cy="105" rx="38" ry="42" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- HUGE eyes -->
  <ellipse cx="155" cy="105" rx="25" ry="30" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="245" cy="105" rx="25" ry="30" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="155" cy="105" rx="14" ry="18" fill="#27500A"/>
  <ellipse cx="245" cy="105" rx="14" ry="18" fill="#27500A"/>
  <circle cx="150" cy="100" r="5" fill="#FFFFFF"/>
  <circle cx="240" cy="100" r="5" fill="#FFFFFF"/>
  <circle cx="159" cy="110" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="249" cy="110" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Blush -->
  <ellipse cx="115" cy="195" rx="14" ry="10" fill="#F0997B" opacity="0.5"/>
  <ellipse cx="285" cy="195" rx="14" ry="10" fill="#F0997B" opacity="0.5"/>
  <!-- ENORMOUS GRIN (cheek to cheek) -->
  <path d="M95 195 Q200 280 305 195" stroke="#27500A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M95 195 Q200 270 305 195" fill="#27500A" opacity="0.15"/>
  <!-- Tongue peek (right side) -->
  <path d="M250 240 Q270 248 275 260 Q258 260 245 250 Z" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Nostrils -->
  <ellipse cx="190" cy="170" rx="2.5" ry="3" fill="#27500A"/>
  <ellipse cx="210" cy="170" rx="2.5" ry="3" fill="#27500A"/>
</svg>
