<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Bounce - speed (squinted but still grinning) -->
  <!-- Wind lines -->
  <path d="M30 130 Q60 132 90 130" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M20 175 Q60 177 95 175" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M30 220 Q70 222 100 220" stroke="#85B7EB" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Back legs swept -->
  <ellipse cx="115" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="285" cy="345" rx="38" ry="22" fill="#639922" stroke="#27500A" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="280" rx="100" ry="80" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="200" cy="290" rx="65" ry="55" fill="#C0DD97" stroke="#639922" stroke-width="1.5" opacity="0.95"/>
  <!-- Spots flattened -->
  <ellipse cx="155" cy="240" rx="9" ry="5" fill="#639922" opacity="0.4"/>
  <ellipse cx="245" cy="240" rx="9" ry="5" fill="#639922" opacity="0.4"/>
  <!-- Arms -->
  <ellipse cx="125" cy="295" rx="20" ry="14" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="275" cy="295" rx="20" ry="14" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Head -->
  <ellipse cx="200" cy="180" rx="115" ry="105" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Eye bumps -->
  <ellipse cx="155" cy="105" rx="38" ry="42" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="245" cy="105" rx="38" ry="42" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <!-- Squinted eyes with upper lid -->
  <ellipse cx="155" cy="108" rx="25" ry="20" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="245" cy="108" rx="25" ry="20" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
  <ellipse cx="155" cy="110" rx="14" ry="11" fill="#27500A"/>
  <ellipse cx="245" cy="110" rx="14" ry="11" fill="#27500A"/>
  <path d="M130 95 Q155 108 180 95 L180 102 Q155 115 130 102 Z" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <path d="M220 95 Q245 108 270 95 L270 102 Q245 115 220 102 Z" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
  <circle cx="153" cy="110" r="2" fill="#FFFFFF"/>
  <circle cx="243" cy="110" r="2" fill="#FFFFFF"/>
  <!-- Blush -->
  <ellipse cx="115" cy="195" rx="14" ry="10" fill="#F0997B" opacity="0.5"/>
  <ellipse cx="285" cy="195" rx="14" ry="10" fill="#F0997B" opacity="0.5"/>
  <!-- STILL GRINNING -->
  <path d="M95 195 Q200 280 305 195" stroke="#27500A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M95 195 Q200 270 305 195" fill="#27500A" opacity="0.15"/>
  <!-- Tongue peek -->
  <path d="M250 240 Q270 248 275 260 Q258 260 245 250 Z" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Wind streaks -->
  <line x1="105" y1="115" x2="125" y2="115" stroke="#FFFFFF" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="105" y1="160" x2="125" y2="160" stroke="#FFFFFF" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <!-- Nostrils -->
  <ellipse cx="190" cy="170" rx="2.5" ry="3" fill="#27500A"/>
  <ellipse cx="210" cy="170" rx="2.5" ry="3" fill="#27500A"/>
</svg>
