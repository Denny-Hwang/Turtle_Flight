<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Bounce icon -->
  <circle cx="100" cy="100" r="92" fill="#EAF3DE" stroke="#97C459" stroke-width="5"/>
  <defs>
    <clipPath id="bounceCircle">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bounceCircle)">
    <!-- Body merged -->
    <ellipse cx="100" cy="120" rx="78" ry="65" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
    <ellipse cx="100" cy="135" rx="55" ry="42" fill="#C0DD97" stroke="#639922" stroke-width="1.5" opacity="0.95"/>
    <!-- Eye bumps above frame edge -->
    <ellipse cx="65" cy="55" rx="28" ry="32" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
    <ellipse cx="135" cy="55" rx="28" ry="32" fill="#97C459" stroke="#27500A" stroke-width="2.5"/>
    <!-- Eyes -->
    <ellipse cx="65" cy="55" rx="18" ry="22" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
    <ellipse cx="135" cy="55" rx="18" ry="22" fill="#FFFFFF" stroke="#27500A" stroke-width="2.5"/>
    <ellipse cx="65" cy="55" rx="11" ry="14" fill="#27500A"/>
    <ellipse cx="135" cy="55" rx="11" ry="14" fill="#27500A"/>
    <circle cx="62" cy="51" r="4" fill="#FFFFFF"/>
    <circle cx="132" cy="51" r="4" fill="#FFFFFF"/>
    <circle cx="68" cy="58" r="2" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="138" cy="58" r="2" fill="#FFFFFF" opacity="0.5"/>
    <!-- Blush -->
    <ellipse cx="40" cy="125" rx="11" ry="7" fill="#F0997B" opacity="0.5"/>
    <ellipse cx="160" cy="125" rx="11" ry="7" fill="#F0997B" opacity="0.5"/>
    <!-- ENORMOUS GRIN -->
    <path d="M30 120 Q100 195 170 120" stroke="#27500A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M30 120 Q100 188 170 120" fill="#27500A" opacity="0.15"/>
    <!-- Tongue peek -->
    <path d="M138 155 Q153 162 156 172 Q143 172 135 162 Z" fill="#E24B4A" stroke="#A32D2D" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Nostrils -->
    <ellipse cx="93" cy="100" rx="2" ry="2.5" fill="#27500A"/>
    <ellipse cx="107" cy="100" rx="2" ry="2.5" fill="#27500A"/>
  </g>
</svg>
