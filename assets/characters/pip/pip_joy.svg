<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Pip - joy expression -->
  <!-- Sparkles -->
  <path d="M65 95 L68 105 L78 108 L68 111 L65 121 L62 111 L52 108 L62 105 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <path d="M335 90 L337 98 L345 100 L337 102 L335 110 L333 102 L325 100 L333 98 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <path d="M345 200 L347 207 L354 209 L347 211 L345 218 L343 211 L336 209 L343 207 Z" fill="#FAC775" stroke="#BA7517" stroke-width="1"/>
  <!-- Feet -->
  <ellipse cx="170" cy="365" rx="22" ry="10" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="230" cy="365" rx="22" ry="10" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="270" rx="85" ry="100" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <!-- White belly -->
  <path d="M200 195 Q145 200 140 280 Q145 345 200 350 Q255 345 260 280 Q255 200 200 195 Z" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Flippers raised -->
  <ellipse cx="105" cy="240" rx="16" ry="38" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" transform="rotate(-40 105 240)"/>
  <ellipse cx="295" cy="240" rx="16" ry="38" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" transform="rotate(40 295 240)"/>
  <!-- Head -->
  <ellipse cx="200" cy="140" rx="78" ry="80" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <!-- White mask -->
  <path d="M200 100 Q155 110 150 165 Q170 195 200 197 Q230 195 250 165 Q245 110 200 100 Z" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Mohawk -->
  <path d="M188 70 Q190 55 195 65" stroke="#185FA5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M198 65 Q200 48 205 62" stroke="#185FA5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M208 65 Q212 55 215 70" stroke="#185FA5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Crescent eyes -->
  <path d="M160 138 Q173 125 186 138" stroke="#0C447C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M214 138 Q227 125 240 138" stroke="#0C447C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Joy tears -->
  <path d="M160 145 Q156 152 159 158 Q165 155 165 150 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1" stroke-linejoin="round"/>
  <path d="M240 145 Q244 152 241 158 Q235 155 235 150 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1" stroke-linejoin="round"/>
  <!-- Blush -->
  <ellipse cx="150" cy="172" rx="14" ry="9" fill="#F0997B" opacity="0.55"/>
  <ellipse cx="250" cy="172" rx="14" ry="9" fill="#F0997B" opacity="0.55"/>
  <!-- Wide open beak -->
  <path d="M173 175 Q200 165 227 175 Q230 205 200 213 Q170 205 173 175 Z" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="195" rx="16" ry="9" fill="#D85A30"/>
  <path d="M173 175 Q200 180 227 175" stroke="#0C447C" stroke-width="2" fill="none"/>
  <!-- Mini sparkles -->
  <circle cx="115" cy="120" r="3" fill="#FAC775"/>
  <circle cx="285" cy="120" r="3" fill="#FAC775"/>
</svg>
