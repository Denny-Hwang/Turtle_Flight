<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Pip - flying with propeller backpack -->
  <!-- Cloud wisps -->
  <ellipse cx="60" cy="80" rx="22" ry="9" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="345" cy="105" rx="20" ry="8" fill="#FFFFFF" opacity="0.5"/>
  <!-- Propeller blades above -->
  <ellipse cx="200" cy="55" rx="118" ry="14" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="2" opacity="0.7"/>
  <ellipse cx="200" cy="55" rx="118" ry="6" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="200" cy="55" r="14" fill="#BA7517" stroke="#633806" stroke-width="2"/>
  <circle cx="200" cy="55" r="7" fill="#FAC775" stroke="#BA7517" stroke-width="1.5"/>
  <!-- Connector rod -->
  <rect x="195" y="65" width="10" height="35" fill="#5F5E5A" stroke="#3C3F42" stroke-width="2"/>
  <!-- Trail blue exhaust -->
  <circle cx="200" cy="385" r="6" fill="#85B7EB" opacity="0.6"/>
  <circle cx="180" cy="378" r="5" fill="#85B7EB" opacity="0.5"/>
  <circle cx="220" cy="378" r="5" fill="#85B7EB" opacity="0.5"/>
  <circle cx="165" cy="370" r="4" fill="#85B7EB" opacity="0.4"/>
  <circle cx="235" cy="370" r="4" fill="#85B7EB" opacity="0.4"/>
  <!-- Feet dangling -->
  <ellipse cx="170" cy="350" rx="20" ry="10" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5" transform="rotate(15 170 350)"/>
  <ellipse cx="230" cy="350" rx="20" ry="10" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5" transform="rotate(-15 230 350)"/>
  <!-- Body -->
  <ellipse cx="200" cy="255" rx="80" ry="78" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <!-- White belly -->
  <ellipse cx="200" cy="260" rx="55" ry="63" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Backpack on chest -->
  <rect x="172" y="220" width="56" height="68" rx="12" fill="#888780" stroke="#5F5E5A" stroke-width="2.5"/>
  <circle cx="184" cy="235" r="3" fill="#BA7517" stroke="#633806" stroke-width="0.8"/>
  <circle cx="216" cy="235" r="3" fill="#BA7517" stroke="#633806" stroke-width="0.8"/>
  <circle cx="184" cy="275" r="3" fill="#BA7517" stroke="#633806" stroke-width="0.8"/>
  <circle cx="216" cy="275" r="3" fill="#BA7517" stroke="#633806" stroke-width="0.8"/>
  <!-- Chest straps -->
  <path d="M168 220 Q185 230 200 235 Q215 230 232 220" stroke="#5F5E5A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Flippers spread wide -->
  <ellipse cx="100" cy="240" rx="14" ry="40" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" transform="rotate(-50 100 240)"/>
  <ellipse cx="300" cy="240" rx="14" ry="40" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" transform="rotate(50 300 240)"/>
  <!-- Head -->
  <circle cx="200" cy="155" r="100" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="200" cy="170" rx="60" ry="65" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Mohawk -->
  <path d="M188 65 Q190 50 195 62" stroke="#185FA5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M198 60 Q200 45 205 58" stroke="#185FA5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M208 62 Q212 52 215 65" stroke="#185FA5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="172" cy="160" rx="20" ry="24" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="228" cy="160" rx="20" ry="24" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="172" cy="158" rx="13" ry="16" fill="#0C447C"/>
  <ellipse cx="228" cy="158" rx="13" ry="16" fill="#0C447C"/>
  <circle cx="167" cy="153" r="5" fill="#FFFFFF"/>
  <circle cx="223" cy="153" r="5" fill="#FFFFFF"/>
  <circle cx="178" cy="164" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="234" cy="164" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Blush -->
  <ellipse cx="135" cy="200" rx="13" ry="9" fill="#F0997B" opacity="0.55"/>
  <ellipse cx="265" cy="200" rx="13" ry="9" fill="#F0997B" opacity="0.55"/>
  <!-- Open beak -->
  <path d="M186 205 Q200 198 214 205 Q214 225 200 229 Q186 225 186 205 Z" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="200" cy="217" rx="9" ry="5" fill="#D85A30"/>
  <path d="M186 205 Q200 209 214 205" stroke="#0C447C" stroke-width="2" fill="none"/>
</svg>
