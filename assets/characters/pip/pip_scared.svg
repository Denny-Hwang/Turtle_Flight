<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Pip - scared expression -->
  <!-- Feet -->
  <ellipse cx="170" cy="365" rx="22" ry="10" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="230" cy="365" rx="22" ry="10" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="270" rx="85" ry="100" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <!-- White belly -->
  <path d="M200 195 Q145 200 140 280 Q145 345 200 350 Q255 345 260 280 Q255 200 200 195 Z" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Head (FIRST so flippers cover later) -->
  <ellipse cx="200" cy="140" rx="78" ry="80" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <!-- White mask -->
  <path d="M200 100 Q155 110 150 165 Q170 195 200 197 Q230 195 250 165 Q245 110 200 100 Z" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Mohawk -->
  <path d="M188 70 Q190 55 195 65" stroke="#185FA5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M198 65 Q200 48 205 62" stroke="#185FA5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M208 65 Q212 55 215 70" stroke="#185FA5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- HUGE eyes peeking through gap -->
  <ellipse cx="173" cy="138" rx="17" ry="22" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="227" cy="138" rx="17" ry="22" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="173" cy="135" rx="3" ry="4" fill="#0C447C"/>
  <ellipse cx="227" cy="135" rx="3" ry="4" fill="#0C447C"/>
  <circle cx="172" cy="133" r="1.3" fill="#FFFFFF"/>
  <circle cx="226" cy="133" r="1.3" fill="#FFFFFF"/>
  <!-- Tiny closed beak -->
  <path d="M192 178 Q200 173 208 178 Q208 188 200 190 Q192 188 192 178 Z" fill="#EF9F27" stroke="#0C447C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="192" y1="183" x2="208" y2="183" stroke="#0C447C" stroke-width="1.5"/>
  <!-- Sweat drop -->
  <path d="M275 110 Q272 122 275 130 Q282 126 282 118 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="277" cy="118" rx="1.5" ry="2" fill="#FFFFFF" opacity="0.8"/>
  <!-- Flippers covering face with gap (drawn on top) -->
  <path d="M105 165 Q145 110 175 105 Q195 105 200 130 Q195 145 175 150 Q145 165 115 195 Q100 185 105 165 Z" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M295 165 Q255 110 225 105 Q205 105 200 130 Q205 145 225 150 Q255 165 285 195 Q300 185 295 165 Z" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
