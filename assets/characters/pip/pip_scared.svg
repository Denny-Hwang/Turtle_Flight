<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Pip - scared -->
  <!-- Feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="290" rx="80" ry="80" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="200" cy="295" rx="55" ry="65" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Head -->
  <circle cx="200" cy="170" r="105" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="200" cy="185" rx="62" ry="68" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
  <!-- Mohawk -->
  <path d="M188 75 Q190 60 195 72" stroke="#185FA5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M198 70 Q200 55 205 68" stroke="#185FA5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M208 72 Q212 62 215 75" stroke="#185FA5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Huge eyes peeking through gap -->
  <ellipse cx="172" cy="175" rx="24" ry="30" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="228" cy="175" rx="24" ry="30" fill="#FFFFFF" stroke="#0C447C" stroke-width="2.5"/>
  <ellipse cx="172" cy="173" rx="4" ry="6" fill="#0C447C"/>
  <ellipse cx="228" cy="173" rx="4" ry="6" fill="#0C447C"/>
  <circle cx="170" cy="170" r="1.5" fill="#FFFFFF"/>
  <circle cx="226" cy="170" r="1.5" fill="#FFFFFF"/>
  <!-- Tiny closed beak -->
  <path d="M192 220 Q200 215 208 220 Q210 232 200 235 Q190 232 192 220 Z" fill="#EF9F27" stroke="#0C447C" stroke-width="2" stroke-linejoin="round"/>
  <line x1="192" y1="225" x2="208" y2="225" stroke="#0C447C" stroke-width="1.5"/>
  <!-- Sweat drop -->
  <path d="M285 130 Q282 142 285 152 Q293 147 293 138 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="288" cy="138" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Flippers covering face with peek gap (drawn last) -->
  <path d="M115 195 Q150 130 175 125 Q190 130 192 150 Q188 162 175 168 Q150 180 130 215 Q110 210 115 195 Z" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M285 195 Q250 130 225 125 Q210 130 208 150 Q212 162 225 168 Q250 180 270 215 Q290 210 285 195 Z" fill="#185FA5" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
