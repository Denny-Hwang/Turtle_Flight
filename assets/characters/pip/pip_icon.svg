<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pip icon -->
  <circle cx="100" cy="100" r="92" fill="#E6F1FB" stroke="#378ADD" stroke-width="5"/>
  <defs>
    <clipPath id="pipCircle">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pipCircle)">
    <!-- Head -->
    <ellipse cx="100" cy="105" rx="62" ry="65" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
    <!-- White mask -->
    <path d="M100 73 Q70 80 67 130 Q82 155 100 157 Q118 155 133 130 Q130 80 100 73 Z" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
    <!-- Mohawk -->
    <path d="M91 50 Q93 38 97 47" stroke="#185FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M99 45 Q101 32 105 43" stroke="#185FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M107 47 Q110 38 113 50" stroke="#185FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="80" cy="105" rx="9" ry="13" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
    <ellipse cx="120" cy="105" rx="9" ry="13" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
    <ellipse cx="80" cy="101" rx="5" ry="7" fill="#0C447C"/>
    <ellipse cx="120" cy="101" rx="5" ry="7" fill="#0C447C"/>
    <circle cx="78" cy="98" r="2.2" fill="#FFFFFF"/>
    <circle cx="118" cy="98" r="2.2" fill="#FFFFFF"/>
    <circle cx="82" cy="103" r="1.2" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="122" cy="103" r="1.2" fill="#FFFFFF" opacity="0.5"/>
    <!-- Blush -->
    <ellipse cx="65" cy="130" rx="9" ry="6" fill="#F0997B" opacity="0.45"/>
    <ellipse cx="135" cy="130" rx="9" ry="6" fill="#F0997B" opacity="0.45"/>
    <!-- Open beak -->
    <path d="M86 138 Q100 130 114 138 Q114 156 100 161 Q86 156 86 138 Z" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="100" cy="148" rx="8" ry="5" fill="#D85A30"/>
    <path d="M86 138 Q100 141 114 138" stroke="#0C447C" stroke-width="1.8" fill="none"/>
  </g>
