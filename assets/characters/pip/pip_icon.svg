<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pip icon -->
  <circle cx="100" cy="100" r="92" fill="#E6F1FB" stroke="#378ADD" stroke-width="5"/>
  <defs>
    <clipPath id="pipCircle">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pipCircle)">
    <!-- Head -->
    <circle cx="100" cy="100" r="78" fill="#378ADD" stroke="#0C447C" stroke-width="2.5"/>
    <!-- White face mask -->
    <ellipse cx="100" cy="110" rx="48" ry="55" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
    <!-- Mohawk -->
    <path d="M91 35 Q93 25 97 33" stroke="#185FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M99 30 Q101 18 105 28" stroke="#185FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M107 33 Q110 23 113 35" stroke="#185FA5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="80" cy="100" rx="14" ry="17" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
    <ellipse cx="120" cy="100" rx="14" ry="17" fill="#FFFFFF" stroke="#0C447C" stroke-width="2"/>
    <ellipse cx="80" cy="98" rx="9" ry="11" fill="#0C447C"/>
    <ellipse cx="120" cy="98" rx="9" ry="11" fill="#0C447C"/>
    <circle cx="76" cy="93" r="3.5" fill="#FFFFFF"/>
    <circle cx="116" cy="93" r="3.5" fill="#FFFFFF"/>
    <circle cx="83" cy="103" r="1.8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="123" cy="103" r="1.8" fill="#FFFFFF" opacity="0.5"/>
    <!-- Blush -->
    <ellipse cx="60" cy="135" rx="9" ry="6" fill="#F0997B" opacity="0.55"/>
    <ellipse cx="140" cy="135" rx="9" ry="6" fill="#F0997B" opacity="0.55"/>
    <!-- Open beak -->
    <path d="M88 138 Q100 131 112 138 Q112 156 100 161 Q88 156 88 138 Z" fill="#EF9F27" stroke="#0C447C" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="100" cy="148" rx="7" ry="4" fill="#D85A30"/>
    <path d="M88 138 Q100 142 112 138" stroke="#0C447C" stroke-width="1.8" fill="none"/>
  </g>
</svg>
