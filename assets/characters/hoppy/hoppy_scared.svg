<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Hoppy scared (BOTH ears flat horizontal) -->
  <!-- Cotton tail -->
  <circle cx="305" cy="305" r="14" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
  <circle cx="295" cy="315" r="9" fill="#FFFFFF" stroke="#712B13" stroke-width="1.8"/>
  <circle cx="313" cy="315" r="9" fill="#FFFFFF" stroke="#712B13" stroke-width="1.8"/>
  <!-- Hind feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="305" rx="80" ry="70" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <path d="M200 270 Q180 258 175 280 Q175 295 200 312 Q225 295 225 280 Q220 258 200 270 Z" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Paws clasped tight -->
  <ellipse cx="180" cy="335" rx="18" ry="14" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="220" cy="335" rx="18" ry="14" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <line x1="200" y1="333" x2="200" y2="348" stroke="#712B13" stroke-width="1.2"/>
  <!-- Both ears flat horizontal -->
  <ellipse cx="105" cy="160" rx="55" ry="14" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="110" cy="160" rx="42" ry="9" fill="#F5C4B3"/>
  <ellipse cx="295" cy="160" rx="55" ry="14" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="290" cy="160" rx="42" ry="9" fill="#F5C4B3"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="100" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Cheek tufts -->
  <circle cx="115" cy="215" r="14" fill="#FAECE7" stroke="#712B13" stroke-width="2"/>
  <circle cx="285" cy="215" r="14" fill="#FAECE7" stroke="#712B13" stroke-width="2"/>
  <!-- Worried eyebrows (50%) -->
  <path d="M150 145 Q170 135 185 145" stroke="#712B13" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M215 145 Q230 135 250 145" stroke="#712B13" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Huge teary eyes -->
  <ellipse cx="170" cy="185" rx="22" ry="28" fill="#FFFFFF" stroke="#712B13" stroke-width="3"/>
  <ellipse cx="230" cy="185" rx="22" ry="28" fill="#FFFFFF" stroke="#712B13" stroke-width="3"/>
  <ellipse cx="170" cy="187" rx="11" ry="14" fill="#712B13"/>
  <ellipse cx="230" cy="187" rx="11" ry="14" fill="#712B13"/>
  <circle cx="166" cy="183" r="4" fill="#FFFFFF"/>
  <circle cx="226" cy="183" r="4" fill="#FFFFFF"/>
  <!-- Tear dots -->
  <circle cx="170" cy="218" r="3" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <circle cx="230" cy="218" r="3" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <ellipse cx="169" cy="217" rx="1" ry="1.2" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="229" cy="217" rx="1" ry="1.2" fill="#FFFFFF" opacity="0.8"/>
  <!-- Nose -->
  <path d="M193 218 Q200 213 207 218 Q207 226 200 230 Q193 226 193 218 Z" fill="#D85A30" stroke="#712B13" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Trembling wavy mouth -->
  <path d="M180 245 Q188 240 195 245 Q202 250 209 245 Q216 240 220 245" stroke="#712B13" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Sweat drop -->
  <path d="M295 130 Q292 142 295 152 Q303 147 303 138 Z" fill="#85B7EB" stroke="#185FA5" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="298" cy="138" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
