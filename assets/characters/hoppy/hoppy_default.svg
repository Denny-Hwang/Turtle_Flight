<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Hoppy the Bunny - default expression -->
  <!-- Cotton ball tail -->
  <circle cx="305" cy="280" r="13" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
  <circle cx="295" cy="290" r="9" fill="#FFFFFF" stroke="#712B13" stroke-width="1.8"/>
  <circle cx="313" cy="290" r="9" fill="#FFFFFF" stroke="#712B13" stroke-width="1.8"/>
  <!-- Hind feet -->
  <ellipse cx="155" cy="345" rx="28" ry="14" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="245" cy="345" rx="28" ry="14" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Body (round fluffy) -->
  <ellipse cx="200" cy="280" rx="85" ry="80" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Heart-shaped chest patch (white) -->
  <path d="M200 240 Q170 230 165 260 Q165 285 200 305 Q235 285 235 260 Q230 230 200 240 Z" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Paws clasped front (shy pose) -->
  <ellipse cx="180" cy="320" rx="20" ry="16" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="220" cy="320" rx="20" ry="16" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Paws touching -->
  <line x1="200" y1="318" x2="200" y2="335" stroke="#712B13" stroke-width="1.2"/>
  <!-- LEFT EAR upright (character's left = our right when facing camera... but we'll go with screen-left) -->
  <!-- Left ear (upright) -->
  <ellipse cx="155" cy="80" rx="16" ry="55" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="155" cy="85" rx="9" ry="42" fill="#F5C4B3"/>
  <!-- Right ear (drooping ~25-28 degrees) -->
  <g transform="rotate(28 245 80)">
    <ellipse cx="245" cy="80" rx="16" ry="55" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
    <ellipse cx="245" cy="85" rx="9" ry="42" fill="#F5C4B3"/>
  </g>
  <!-- Head -->
  <ellipse cx="200" cy="160" rx="92" ry="85" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Fluffy cheek tufts -->
  <circle cx="120" cy="190" r="14" fill="#FAECE7" stroke="#712B13" stroke-width="2"/>
  <circle cx="280" cy="190" r="14" fill="#FAECE7" stroke="#712B13" stroke-width="2"/>
  <!-- Flower behind left ear -->
  <ellipse cx="135" cy="42" rx="8" ry="10" fill="#ED93B1" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="125" cy="50" rx="9" ry="7" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="145" cy="50" rx="9" ry="7" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="130" cy="62" rx="8" ry="7" fill="#ED93B1" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="140" cy="62" rx="8" ry="7" fill="#ED93B1" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="135" cy="55" r="5" fill="#EF9F27" stroke="#BA7517" stroke-width="1"/>
  <circle cx="135" cy="55" r="2" fill="#FAC775"/>
  <!-- Soft eyebrows (worried angle) -->
  <path d="M158 130 Q170 124 178 130" stroke="#712B13" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M222 130 Q230 124 242 130" stroke="#712B13" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- Eyes (slightly downcast - pupil lower) -->
  <ellipse cx="170" cy="160" rx="11" ry="14" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
  <ellipse cx="230" cy="160" rx="11" ry="14" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
  <ellipse cx="170" cy="164" rx="6" ry="8" fill="#712B13"/>
  <ellipse cx="230" cy="164" rx="6" ry="8" fill="#712B13"/>
  <circle cx="167" cy="161" r="2.5" fill="#FFFFFF"/>
  <circle cx="227" cy="161" r="2.5" fill="#FFFFFF"/>
  <circle cx="172" cy="167" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="232" cy="167" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Extra tiny sparkle dots -->
  <circle cx="174" cy="155" r="1" fill="#FFFFFF"/>
  <circle cx="234" cy="155" r="1" fill="#FFFFFF"/>
  <!-- Bigger blush marks -->
  <ellipse cx="135" cy="200" rx="14" ry="9" fill="#ED93B1" opacity="0.35"/>
  <ellipse cx="265" cy="200" rx="14" ry="9" fill="#ED93B1" opacity="0.35"/>
  <!-- Pink nose with shine -->
  <path d="M195 188 Q200 184 205 188 Q205 196 200 199 Q195 196 195 188 Z" fill="#D85A30" stroke="#712B13" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="198" cy="190" rx="2" ry="1.5" fill="#F0997B" opacity="0.6"/>
  <!-- "3" mouth -->
  <path d="M200 205 Q190 213 195 220 Q200 215 200 220 Q200 215 205 220 Q210 213 200 205" stroke="#712B13" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Subtle smile line below -->
  <path d="M188 228 Q200 232 212 228" stroke="#712B13" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.45"/>
</svg>
