<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Hoppy flying with carrot jet (carrot held to side, like reference) -->
  <!-- Heart-shape exhaust trail -->
  <path d="M55 320 Q50 315 50 322 Q50 330 60 335 Q70 330 70 322 Q70 315 65 320 Q60 318 55 320 Z" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round" opacity="0.85"/>
  <path d="M40 360 Q37 356 37 361 Q37 367 44 370 Q51 367 51 361 Q51 356 47 360 Q43 358 40 360 Z" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round" opacity="0.7"/>
  <!-- Cotton tail -->
  <circle cx="305" cy="305" r="14" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
  <circle cx="295" cy="315" r="9" fill="#FFFFFF" stroke="#712B13" stroke-width="1.8"/>
  <circle cx="313" cy="315" r="9" fill="#FFFFFF" stroke="#712B13" stroke-width="1.8"/>
  <!-- Hind feet -->
  <ellipse cx="170" cy="370" rx="22" ry="11" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="230" cy="370" rx="22" ry="11" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Body -->
  <ellipse cx="200" cy="305" rx="80" ry="70" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <path d="M200 270 Q180 258 175 280 Q175 295 200 312 Q225 295 225 280 Q220 258 200 270 Z" fill="#FFFFFF" stroke="#F5C4B3" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left paw clasped -->
  <ellipse cx="180" cy="340" rx="17" ry="13" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Right paw extended holding carrot -->
  <ellipse cx="225" cy="335" rx="17" ry="13" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Carrot held to right (long carrot wand) -->
  <!-- Leafy fins (back of carrot) -->
  <path d="M250 248 L270 230 L260 252" fill="#97C459" stroke="#27500A" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M255 245 L280 220 L268 250" fill="#639922" stroke="#27500A" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M260 248 L290 232 L272 256" fill="#C0DD97" stroke="#27500A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Carrot body (orange tapered tube) -->
  <path d="M260 250 Q360 240 380 270 Q360 285 260 275 Z" fill="#EF9F27" stroke="#712B13" stroke-width="2" stroke-linejoin="round"/>
  <!-- Carrot tip darker -->
  <path d="M375 268 Q385 270 380 280 Q373 278 372 274 Z" fill="#BA7517" stroke="#712B13" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cockpit window -->
  <ellipse cx="305" cy="265" rx="14" ry="6" fill="#FAC775" stroke="#712B13" stroke-width="1.5"/>
  <line x1="298" y1="262" x2="302" y2="261" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
  <!-- Carrot ring grooves -->
  <path d="M280 252 Q280 270 280 275" stroke="#BA7517" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M340 248 Q340 265 340 273" stroke="#BA7517" stroke-width="1.2" fill="none" opacity="0.4"/>
  <!-- Left ear UP -->
  <ellipse cx="160" cy="80" rx="16" ry="62" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="160" cy="85" rx="9" ry="48" fill="#F5C4B3"/>
  <!-- Right ear (slight droop / tilt as in reference) -->
  <g transform="rotate(15 240 80)">
    <ellipse cx="240" cy="80" rx="16" ry="62" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
    <ellipse cx="240" cy="85" rx="9" ry="48" fill="#F5C4B3"/>
  </g>
  <!-- Flower -->
  <ellipse cx="138" cy="40" rx="7" ry="9" fill="#ED93B1" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="129" cy="48" rx="8" ry="6" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="147" cy="48" rx="8" ry="6" fill="#F5C4B3" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <ellipse cx="138" cy="58" rx="7" ry="6" fill="#ED93B1" stroke="#A32D2D" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="138" cy="50" r="5" fill="#EF9F27" stroke="#BA7517" stroke-width="1"/>
  <circle cx="138" cy="50" r="2" fill="#FAC775"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="100" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
  <!-- Cheek tufts -->
  <circle cx="115" cy="215" r="14" fill="#FAECE7" stroke="#712B13" stroke-width="2"/>
  <circle cx="285" cy="215" r="14" fill="#FAECE7" stroke="#712B13" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="170" cy="180" rx="20" ry="24" fill="#FFFFFF" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="230" cy="180" rx="20" ry="24" fill="#FFFFFF" stroke="#712B13" stroke-width="2.5"/>
  <ellipse cx="170" cy="180" rx="13" ry="16" fill="#712B13"/>
  <ellipse cx="230" cy="180" rx="13" ry="16" fill="#712B13"/>
  <circle cx="166" cy="175" r="5" fill="#FFFFFF"/>
  <circle cx="226" cy="175" r="5" fill="#FFFFFF"/>
  <circle cx="174" cy="186" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="234" cy="186" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Blush -->
  <ellipse cx="135" cy="220" rx="14" ry="9" fill="#ED93B1" opacity="0.45"/>
  <ellipse cx="265" cy="220" rx="14" ry="9" fill="#ED93B1" opacity="0.45"/>
  <!-- Pink nose -->
  <path d="M193 215 Q200 210 207 215 Q207 224 200 227 Q193 224 193 215 Z" fill="#D85A30" stroke="#712B13" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="196" cy="217" rx="2" ry="1.5" fill="#F0997B" opacity="0.6"/>
  <!-- "3" mouth -->
  <path d="M200 232 Q188 240 194 248 Q200 244 200 248 Q200 244 206 248 Q212 240 200 232" stroke="#712B13" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
