<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Hoppy icon -->
  <circle cx="100" cy="100" r="92" fill="#FAECE7" stroke="#F0997B" stroke-width="5"/>
  <defs>
    <clipPath id="hoppyCircle">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#hoppyCircle)">
    <!-- Left ear (upright) -->
    <ellipse cx="65" cy="35" rx="11" ry="40" fill="#F0997B" stroke="#712B13" stroke-width="2"/>
    <ellipse cx="65" cy="38" rx="6" ry="30" fill="#F5C4B3"/>
    <!-- Right ear (drooping) -->
    <g transform="rotate(28 135 35)">
      <ellipse cx="135" cy="35" rx="11" ry="40" fill="#F0997B" stroke="#712B13" stroke-width="2"/>
      <ellipse cx="135" cy="38" rx="6" ry="30" fill="#F5C4B3"/>
    </g>
    <!-- Flower behind left ear -->
    <ellipse cx="50" cy="20" rx="5" ry="6" fill="#ED93B1" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <ellipse cx="44" cy="25" rx="6" ry="4" fill="#F5C4B3" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <ellipse cx="56" cy="25" rx="6" ry="4" fill="#F5C4B3" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <ellipse cx="50" cy="32" rx="5" ry="4" fill="#ED93B1" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="50" cy="27" r="3" fill="#EF9F27" stroke="#BA7517" stroke-width="0.8"/>
    <circle cx="50" cy="27" r="1.3" fill="#FAC775"/>
    <!-- Head -->
    <ellipse cx="100" cy="115" rx="68" ry="62" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
    <!-- Fluffy cheeks -->
    <circle cx="50" cy="140" r="11" fill="#FAECE7" stroke="#712B13" stroke-width="1.8"/>
    <circle cx="150" cy="140" r="11" fill="#FAECE7" stroke="#712B13" stroke-width="1.8"/>
    <!-- Soft eyebrows -->
    <path d="M68 95 Q78 91 84 95" stroke="#712B13" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.3"/>
    <path d="M116 95 Q122 91 132 95" stroke="#712B13" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.3"/>
    <!-- Eyes (downcast) -->
    <ellipse cx="80" cy="115" rx="9" ry="12" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
    <ellipse cx="120" cy="115" rx="9" ry="12" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
    <ellipse cx="80" cy="119" rx="5" ry="7" fill="#712B13"/>
    <ellipse cx="120" cy="119" rx="5" ry="7" fill="#712B13"/>
    <circle cx="78" cy="116" r="2.2" fill="#FFFFFF"/>
    <circle cx="118" cy="116" r="2.2" fill="#FFFFFF"/>
    <circle cx="82" cy="122" r="1.2" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="122" cy="122" r="1.2" fill="#FFFFFF" opacity="0.5"/>
    <!-- Blush -->
    <ellipse cx="62" cy="148" rx="10" ry="6" fill="#ED93B1" opacity="0.4"/>
    <ellipse cx="138" cy="148" rx="10" ry="6" fill="#ED93B1" opacity="0.4"/>
    <!-- Nose -->
    <path d="M96 138 Q100 135 104 138 Q104 145 100 147 Q96 145 96 138 Z" fill="#D85A30" stroke="#712B13" stroke-width="1.3" stroke-linejoin="round"/>
    <ellipse cx="98" cy="139" rx="1.5" ry="1" fill="#F0997B" opacity="0.6"/>
    <!-- "3" mouth -->
    <path d="M100 152 Q92 159 96 165 Q100 161 100 165 Q100 161 104 165 Q108 159 100 152" stroke="#712B13" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Smile line -->
    <path d="M90 170 Q100 174 110 170" stroke="#712B13" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
