<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Hoppy icon -->
  <circle cx="100" cy="100" r="92" fill="#FAECE7" stroke="#F0997B" stroke-width="5"/>
  <defs>
    <clipPath id="hoppyCircle">
      <circle cx="100" cy="100" r="88"/>
    </clipPath>
  </defs>
  <g clip-path="url(#hoppyCircle)">
    <!-- Left ear up -->
    <ellipse cx="78" cy="20" rx="11" ry="42" fill="#F0997B" stroke="#712B13" stroke-width="2"/>
    <ellipse cx="78" cy="22" rx="6" ry="32" fill="#F5C4B3"/>
    <!-- Right ear (slight tilt) -->
    <g transform="rotate(15 122 20)">
      <ellipse cx="122" cy="20" rx="11" ry="42" fill="#F0997B" stroke="#712B13" stroke-width="2"/>
      <ellipse cx="122" cy="22" rx="6" ry="32" fill="#F5C4B3"/>
    </g>
    <!-- Flower -->
    <ellipse cx="65" cy="0" rx="5" ry="6" fill="#ED93B1" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <ellipse cx="59" cy="5" rx="6" ry="4" fill="#F5C4B3" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <ellipse cx="71" cy="5" rx="6" ry="4" fill="#F5C4B3" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <ellipse cx="65" cy="12" rx="5" ry="4" fill="#ED93B1" stroke="#A32D2D" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="65" cy="7" r="3" fill="#EF9F27" stroke="#BA7517" stroke-width="0.8"/>
    <circle cx="65" cy="7" r="1.3" fill="#FAC775"/>
    <!-- Head -->
    <circle cx="100" cy="115" r="72" fill="#F0997B" stroke="#712B13" stroke-width="2.5"/>
    <!-- Cheek tufts -->
    <circle cx="40" cy="140" r="11" fill="#FAECE7" stroke="#712B13" stroke-width="1.8"/>
    <circle cx="160" cy="140" r="11" fill="#FAECE7" stroke="#712B13" stroke-width="1.8"/>
    <!-- Soft eyebrows -->
    <path d="M68 95 Q78 91 84 95" stroke="#712B13" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.3"/>
    <path d="M116 95 Q122 91 132 95" stroke="#712B13" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.3"/>
    <!-- Eyes (large round, slight downcast) -->
    <ellipse cx="80" cy="115" rx="14" ry="17" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
    <ellipse cx="120" cy="115" rx="14" ry="17" fill="#FFFFFF" stroke="#712B13" stroke-width="2"/>
    <ellipse cx="80" cy="118" rx="9" ry="11" fill="#712B13"/>
    <ellipse cx="120" cy="118" rx="9" ry="11" fill="#712B13"/>
    <circle cx="76" cy="114" r="3.5" fill="#FFFFFF"/>
    <circle cx="116" cy="114" r="3.5" fill="#FFFFFF"/>
    <circle cx="83" cy="122" r="1.8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="123" cy="122" r="1.8" fill="#FFFFFF" opacity="0.5"/>
    <!-- Blush -->
    <ellipse cx="60" cy="148" rx="10" ry="6" fill="#ED93B1" opacity="0.4"/>
    <ellipse cx="140" cy="148" rx="10" ry="6" fill="#ED93B1" opacity="0.4"/>
    <!-- Nose -->
    <path d="M94 145 Q100 140 106 145 Q106 152 100 154 Q94 152 94 145 Z" fill="#D85A30" stroke="#712B13" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- "3" mouth -->
    <path d="M100 158 Q92 165 96 171 Q100 167 100 171 Q100 167 104 171 Q108 165 100 158" stroke="#712B13" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Smile line -->
    <path d="M90 178 Q100 182 110 178" stroke="#712B13" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
