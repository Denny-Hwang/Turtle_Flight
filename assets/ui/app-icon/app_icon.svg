<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- App icon - rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="#85B7EB"/>
  <rect x="0" y="0" width="1024" height="512" rx="200" fill="#B5D4F4" opacity="0.5"/>
  <rect x="0" y="0" width="1024" height="256" rx="200" fill="#E6F1FB" opacity="0.4"/>
  <!-- Cloud hints -->
  <ellipse cx="180" cy="220" rx="110" ry="40" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="850" cy="300" rx="120" ry="42" fill="#FFFFFF" opacity="0.13"/>
  <ellipse cx="500" cy="180" rx="90" ry="32" fill="#FFFFFF" opacity="0.10"/>
  <!-- Sparkles -->
  <path d="M150 400 L155 420 L175 425 L155 430 L150 450 L145 430 L125 425 L145 420 Z" fill="#FFFFFF" opacity="0.22"/>
  <path d="M870 480 L874 495 L889 499 L874 503 L870 518 L866 503 L851 499 L866 495 Z" fill="#FFFFFF" opacity="0.20"/>
  <!-- Flame trails -->
  <path d="M380 820 Q420 920 512 980 Q604 920 644 820 Z" fill="#EF9F27" opacity="0.6"/>
  <path d="M420 820 Q450 900 512 950 Q574 900 604 820 Z" fill="#E8593C" opacity="0.6"/>
  <!-- Side booster flames -->
  <path d="M280 770 Q300 830 325 855 Q345 830 360 770 Z" fill="#EF9F27" opacity="0.55"/>
  <path d="M664 770 Q684 830 704 855 Q724 830 744 770 Z" fill="#EF9F27" opacity="0.55"/>
  <!-- Side boosters -->
  <rect x="270" y="650" width="80" height="130" rx="22" fill="#888780" stroke="#5F5E5A" stroke-width="6"/>
  <rect x="674" y="650" width="80" height="130" rx="22" fill="#888780" stroke="#5F5E5A" stroke-width="6"/>
  <ellipse cx="310" cy="775" rx="40" ry="12" fill="#3C3F42" stroke="#000" stroke-width="3"/>
  <ellipse cx="714" cy="775" rx="40" ry="12" fill="#3C3F42" stroke="#000" stroke-width="3"/>
  <!-- Center thruster -->
  <path d="M442 760 L420 820 L604 820 L582 760 Z" fill="#888780" stroke="#5F5E5A" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="512" cy="820" rx="92" ry="16" fill="#3C3F42" stroke="#000" stroke-width="4"/>
  <!-- Body -->
  <ellipse cx="512" cy="660" rx="220" ry="155" fill="#5DCAA5" stroke="#085041" stroke-width="6"/>
  <ellipse cx="512" cy="680" rx="140" ry="105" fill="#FAEEDA" stroke="#085041" stroke-width="5"/>
  <!-- Arms outstretched -->
  <ellipse cx="290" cy="600" rx="55" ry="32" fill="#5DCAA5" stroke="#085041" stroke-width="6" transform="rotate(-15 290 600)"/>
  <ellipse cx="734" cy="600" rx="55" ry="32" fill="#5DCAA5" stroke="#085041" stroke-width="6" transform="rotate(15 734 600)"/>
  <!-- Scarf around neck -->
  <path d="M395 555 Q512 575 629 555 Q635 605 615 625 Q512 645 409 625 Q389 605 395 555 Z" fill="#E24B4A" stroke="#085041" stroke-width="6" stroke-linejoin="round"/>
  <!-- Scarf streaming left -->
  <path d="M395 565 Q260 555 130 615 Q175 655 290 635 Q360 615 395 600 Z" fill="#E24B4A" stroke="#085041" stroke-width="5" stroke-linejoin="round"/>
  <!-- Head (BIG) -->
  <circle cx="512" cy="430" r="270" fill="#5DCAA5" stroke="#085041" stroke-width="6"/>
  <!-- Cheek blush -->
  <circle cx="280" cy="495" r="32" fill="#F0997B" opacity="0.5"/>
  <circle cx="744" cy="495" r="32" fill="#F0997B" opacity="0.5"/>
  <!-- Eyes -->
  <ellipse cx="430" cy="430" rx="48" ry="58" fill="#FFFFFF" stroke="#085041" stroke-width="6"/>
  <ellipse cx="594" cy="430" rx="48" ry="58" fill="#FFFFFF" stroke="#085041" stroke-width="6"/>
  <ellipse cx="432" cy="425" rx="32" ry="40" fill="#085041"/>
  <ellipse cx="596" cy="425" rx="32" ry="40" fill="#085041"/>
  <circle cx="420" cy="412" r="13" fill="#FFFFFF"/>
  <circle cx="584" cy="412" r="13" fill="#FFFFFF"/>
  <circle cx="442" cy="438" r="6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="606" cy="438" r="6" fill="#FFFFFF" opacity="0.5"/>
  <!-- Round brass glasses ON FACE -->
  <circle cx="430" cy="430" r="76" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="8"/>
  <circle cx="594" cy="430" r="76" fill="#E6F1FB" fill-opacity="0.18" stroke="#BA7517" stroke-width="8"/>
  <line x1="506" y1="430" x2="518" y2="430" stroke="#BA7517" stroke-width="8" stroke-linecap="round"/>
  <line x1="354" y1="430" x2="340" y2="425" stroke="#BA7517" stroke-width="6" stroke-linecap="round"/>
  <line x1="670" y1="430" x2="684" y2="425" stroke="#BA7517" stroke-width="6" stroke-linecap="round"/>
  <!-- Glasses shine -->
  <ellipse cx="408" cy="395" rx="20" ry="10" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="572" cy="395" rx="20" ry="10" fill="#FFFFFF" opacity="0.7"/>
  <!-- Smile -->
  <path d="M460 540 Q512 560 564 540" stroke="#085041" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
